name: CHP Validation

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  chp-conformance:
    # Gates on actual protocol behaviour, not file presence. No `|| true` here:
    # a divergence must fail the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Golden vectors are in sync with the reference
        run: |
          python3 spec/conformance/generate_vectors.py
          if ! git diff --quiet -- spec/golden-vectors/; then
            echo "::error::golden-vectors/ is stale — run spec/conformance/generate_vectors.py and commit the result"
            git diff -- spec/golden-vectors/
            exit 1
          fi

      - name: Reference implementation is conformant
        run: python3 spec/conformance/run_conformance.py --adapter reference

      - name: Conformance suite still detects known divergences
        run: |
          # The fixture reproduces real divergences from shipped ports and MUST
          # fail. If it passes, the suite has stopped catching regressions.
          if python3 spec/conformance/run_conformance.py \
               --adapter-cmd "python3 spec/conformance/adapters/legacy_divergence_adapter.py" \
               --quiet > /dev/null 2>&1; then
            echo "::error::legacy divergence fixture PASSED — the conformance suite no longer detects known bugs"
            exit 1
          fi
          echo "fixture correctly rejected"

  chp-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        # The validation step below imports yaml; without this the job fails
        # with ModuleNotFoundError before it checks anything.
        run: pip install --quiet pyyaml
      - name: Validate CHP State Machine
        run: |
          python3 -c "
          import yaml, json, sys
          # Validate R0 config exists and is well-formed
          try:
              with open('.chp/R0_CONFIG.yaml') as f:
                  cfg = yaml.safe_load(f)
              assert 'r0_gate' in cfg, 'Missing r0_gate section'
              assert 'foundation' in cfg, 'Missing foundation section'
              print('R0_CONFIG.yaml: VALID')
          except Exception as e:
              print(f'R0_CONFIG.yaml: INVALID - {e}')
              sys.exit(1)
          # Validate STATE_MACHINE.md exists
          import os
          assert os.path.exists('.chp/STATE_MACHINE.md'), 'Missing STATE_MACHINE.md'
          print('STATE_MACHINE.md: PRESENT')
          # Validate ADVERSARIAL_PROMPTS.md exists
          assert os.path.exists('.chp/ADVERSARIAL_PROMPTS.md'), 'Missing ADVERSARIAL_PROMPTS.md'
          print('ADVERSARIAL_PROMPTS.md: PRESENT')
          # Validate CHP_COMPLIANCE.md exists
          assert os.path.exists('.chp/CHP_COMPLIANCE.md'), 'Missing CHP_COMPLIANCE.md'
          print('CHP_COMPLIANCE.md: PRESENT')
          print('All CHP artifacts validated successfully.')
          "
      # The test suite is deliberately NOT run here. This step used to be:
      #
      #   pytest tests/ ... 2>/dev/null || echo "No tests found or tests skipped"
      #
      # which reported success whatever happened — so 27 failing tests looked
      # green in this workflow while the `test` job in ci.yml went red, and the
      # two jobs installed different dependency sets. That divergence is what
      # hid the missing pytest-asyncio for as long as it did.
      #
      # Tests now have exactly one owner: the `test` job in ci.yml, which runs on
      # the same triggers. This job validates CHP artifacts only.
